    - data:
        code: "\nimport re\n\n\ndef main(text: str) -> dict:\n    \"\"\"Separate the HOLD line from the notes; keep only well-formed student codes.\"\"\"\n    text = re.sub(r\"<think>.*?</think>\", \"\", text or \"\", flags=re.S).strip()\n    lines = text.splitlines()\n    hold = \"\"\n    for i in range(len(lines) - 1, -1, -1):\n        line = lines[i].strip().strip(\"*`_\").strip()\n        if line.upper().startswith(\"HOLD:\"):\n            codes = re.findall(r\"\\bS\\d{2,3}\\b\", line.upper())\n            hold = \", \".join(dict.fromkeys(codes))\n            del lines[i]\n            break\n    notes = \"\\n\".join(lines).strip()\n    if not notes:\n        notes = \"The agent wrote no notes; see the follow-up list on the report page.\"\n    return {\"triage\": notes, \"hold\": hold}\n"

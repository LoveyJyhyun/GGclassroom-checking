<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Classroom Checker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Classroom Checker</a>
    {% if session.get('credentials') %}<a href="{{ url_for('logout') }}">Sign out</a>{% endif %}
  </header>
  <main>
    {% block crumbs %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
